version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    image: camora1990/nequi-challenge-web-api:latest
    container_name: nequi-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mydb
      - DB_USER=admin
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - postgres
    networks:
      - nequi-network
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: nequi-postgres
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    networks:
      - nequi-network
    restart: unless-stopped

networks:
  nequi-network:
    driver: bridge

volumes:
  postgres-data:
    name: postgres-data